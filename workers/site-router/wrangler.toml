name = "forma-site-router"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Bind the SAME R2 bucket the CMS uploads to (the value of R2_BUCKET in the app).
[[r2_buckets]]
binding = "SITE_BUCKET"
bucket_name = "uploads"

# hostname -> tenantId. Add both apex and www if you serve both.
# Find the tenantId in the Tenant table (or scripts/create-tenant.ts output).
[vars]
HOST_MAP = '{"formawizerunku.pl":"cmpmb0k6o0000wkuq6cgar9f2","www.formawizerunku.pl":"cmpmb0k6o0000wkuq6cgar9f2"}'

# Custom domain routing is configured in the Cloudflare dashboard
# (Workers & Pages -> this worker -> Settings -> Domains & Routes -> Add Custom Domain).
# See README.md.
